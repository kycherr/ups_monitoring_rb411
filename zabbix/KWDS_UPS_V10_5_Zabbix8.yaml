zabbix_export:
  version: '8.0'
  template_groups:
  - uuid: b6ac3fa619604430ac532c7037523cc7
    name: Templates/Power
  templates:
  - uuid: 505d33a15d4a435fa76f4264f0a3a8da
    template: KWDS UPS Megatec by TCP
    name: KWDS UPS Megatec by TCP
    description: Read-only Megatec Q1 via MikroTik RAW TCP. ExternalScripts ups_megatec.py;
      host macros control connection and thresholds. No SOC estimation.
    groups:
    - name: Templates/Power
    macros:
    - macro: '{$UPS.IP}'
      value: 127.0.0.1
    - macro: '{$UPS.PORT}'
      value: '9999'
    - macro: '{$UPS.INTERVAL}'
      value: 10m
    - macro: '{$UPS.TIMEOUT}'
      value: '3'
    - macro: '{$UPS.NODATA}'
      value: 25m
    - macro: '{$UPS.INPUT.MIN}'
      value: '180'
    - macro: '{$UPS.INPUT.MAX}'
      value: '250'
    - macro: '{$UPS.OUTPUT.MIN}'
      value: '200'
    - macro: '{$UPS.OUTPUT.MAX}'
      value: '240'
    - macro: '{$UPS.LOAD.MAX}'
      value: '80'
    - macro: '{$UPS.TEMP.MAX}'
      value: '45'
    - macro: '{$UPS.FREQ.MIN}'
      value: '49'
    - macro: '{$UPS.FREQ.MAX}'
      value: '51'
    - macro: '{$UPS.BATTERY.MULTIPLIER}'
      value: '0'
      description: 0 = battery voltage conversion disabled. Set individually per calibrated
        UPS host.
    - macro: '{$UPS.BATTERY.VOLT.WARN}'
      value: '0'
      description: Low battery voltage warning threshold, V. 0 disables voltage warning.
    - macro: '{$UPS.BATTERY.VOLT.CRIT}'
      value: '0'
      description: Critical battery voltage threshold, V. 0 disables critical voltage
        alarm.
    - macro: '{$UPS.POWER.RATED.W}'
      value: '0'
      description: Rated active output power, watts. 0 disables indicative W calculation.
    - macro: '{$UPS.CAPACITY}'
      value: '0'
      description: Effective Ah; set per host after evaluating battery system. 0 =
        not configured; estimated runtime will be 0 until configured.
    - macro: '{$UPS.USABLE}'
      value: '0.80'
      description: Usable fraction of nominal effective energy; calibrate per host.
    - macro: '{$UPS.EFF}'
      value: '0.85'
      description: UPS efficiency factor; calibrate per host.
    - macro: '{$UPS.SOC.WARN}'
      value: '30'
      description: Warning threshold in genuine percent of charge, used only after
        SOC is calibrated and enabled.
    - macro: '{$UPS.SOC.CRIT}'
      value: '15'
      description: Critical threshold in genuine percent of charge, used only after
        SOC is calibrated and enabled.
    - macro: '{$UPS.SOC.ALERTS.ENABLED}'
      value: '0'
      description: 0=disabled until valid BatteryCharge readings are available; 1=enable
        30/15% alert triggers.
    - macro: '{$UPS.BATTERY.VOLT.MAX}'
      value: '27.6'
      description: 'Voltage-adjusted runtime model: voltage assumed to represent full
        energy; set per UPS after calibration.'
    - macro: '{$UPS.BATTERY.VOLT.MIN}'
      value: '21'
      description: 'Voltage-adjusted runtime model: voltage assumed to represent depleted
        usable energy; set per UPS after calibration.'
    - macro: '{$UPS.CELL.MULTIPLIER}'
      value: '0'
      description: Multiplier for single Li-ion cell voltage estimate from Megatec
        raw field. 0 disables; override per UPS host after calibration (e.g. 1.875).
        This is not measured cell voltage.
    items:
    - uuid: d0da7003f152450e9ab7b2b019f9df2d
      name: 'UPS: Megatec Q1 JSON'
      type: EXTERNAL
      key: ups_megatec.py["{$UPS.IP}","{$UPS.PORT}","{$UPS.TIMEOUT}"]
      delay: '{$UPS.INTERVAL}'
      value_type: TEXT
      history: 7d
      description: One Q1 request; JSON master for dependent items. Configure UPS.IP
        per host.
    - uuid: f104739a63c04dcdb1ebf4c907b415ec
      name: 'UPS: Input voltage'
      type: DEPENDENT
      key: ups.InputVoltage
      value_type: FLOAT
      history: 30d
      master_item:
        key: ups_megatec.py["{$UPS.IP}","{$UPS.PORT}","{$UPS.TIMEOUT}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $["ups.InputVoltage"]
        error_handler: DISCARD_VALUE
      trends: 365d
      units: V
    - uuid: 9b5ceb4216ac4bf58af83c108db3dc23
      name: 'UPS: Output voltage'
      type: DEPENDENT
      key: ups.OutputVoltage
      value_type: FLOAT
      history: 30d
      master_item:
        key: ups_megatec.py["{$UPS.IP}","{$UPS.PORT}","{$UPS.TIMEOUT}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $["ups.OutputVoltage"]
        error_handler: DISCARD_VALUE
      trends: 365d
      units: V
    - uuid: de89379a4ef54be29eaa056104cd7996
      name: 'UPS: Battery pack voltage (calibrated only)'
      type: DEPENDENT
      key: ups.BatteryVoltage
      value_type: FLOAT
      history: 30d
      master_item:
        key: ups_megatec.py["{$UPS.IP}","{$UPS.PORT}","{$UPS.TIMEOUT}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $["ups.BatteryRaw"]
        error_handler: DISCARD_VALUE
      - type: JAVASCRIPT
        parameters:
        - 'var k = Number(''{$UPS.BATTERY.MULTIPLIER}'');

          var raw = Number(value);

          if (!isFinite(k) || k <= 0 || !isFinite(raw) || raw < 0) return null;

          return Math.round(raw * k * 1000) / 1000;'
        error_handler: DISCARD_VALUE
      trends: 365d
      units: V
      description: Raw Q1 battery field multiplied by host {$UPS.BATTERY.MULTIPLIER}.
        Default 0 discards values until calibrated. SOC remains disabled.
    - uuid: bb98c1be7dce46828f35c03d45220dff
      name: 'UPS: Battery charge (uncalibrated)'
      type: DEPENDENT
      key: ups.BatteryCharge
      value_type: FLOAT
      history: 30d
      master_item:
        key: ups_megatec.py["{$UPS.IP}","{$UPS.PORT}","{$UPS.TIMEOUT}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $["ups.BatteryCharge"]
        error_handler: DISCARD_VALUE
      trends: 365d
      units: '%'
      description: Reserved key; collector intentionally does not produce this value
        until calibration.
    - uuid: b2891a8132714fb2996b047eaf8a101c
      name: 'UPS: UPS load'
      type: DEPENDENT
      key: ups.UpsLoad
      value_type: UNSIGNED
      history: 30d
      master_item:
        key: ups_megatec.py["{$UPS.IP}","{$UPS.PORT}","{$UPS.TIMEOUT}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $["ups.UpsLoad"]
        error_handler: DISCARD_VALUE
      trends: 365d
      units: '%'
    - uuid: bf8274e0c5ab4fbfa7022d1bdd24511c
      name: 'UPS: UPS frequency'
      type: DEPENDENT
      key: ups.UpsFreq
      value_type: FLOAT
      history: 30d
      master_item:
        key: ups_megatec.py["{$UPS.IP}","{$UPS.PORT}","{$UPS.TIMEOUT}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $["ups.UpsFreq"]
        error_handler: DISCARD_VALUE
      trends: 365d
      units: Hz
    - uuid: 585eb6a9adaf40259cd6c9b9831e0e89
      name: 'UPS: UPS temperature'
      type: DEPENDENT
      key: ups.UpsTemp
      value_type: FLOAT
      history: 30d
      master_item:
        key: ups_megatec.py["{$UPS.IP}","{$UPS.PORT}","{$UPS.TIMEOUT}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $["ups.UpsTemp"]
        error_handler: DISCARD_VALUE
      trends: 365d
      units: °C
    - uuid: cd0a2b10a3364e8bb615913fe72772fc
      name: 'UPS: UPS status'
      type: DEPENDENT
      key: ups.UpsStatus
      value_type: CHAR
      history: 30d
      master_item:
        key: ups_megatec.py["{$UPS.IP}","{$UPS.PORT}","{$UPS.TIMEOUT}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $["ups.UpsStatus"]
        error_handler: DISCARD_VALUE
    - uuid: b1bbfd1060b84601a8b616b64337798f
      name: 'UPS: On battery flag'
      type: DEPENDENT
      key: ups.OnBattery
      value_type: UNSIGNED
      history: 30d
      master_item:
        key: ups_megatec.py["{$UPS.IP}","{$UPS.PORT}","{$UPS.TIMEOUT}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $["ups.OnBattery"]
        error_handler: DISCARD_VALUE
      trends: 365d
      valuemap:
        name: KWDS UPS yes/no UA
    - uuid: 22ff9d4ee126417db47f0dd5bb94f17a
      name: 'UPS: Battery low flag'
      type: DEPENDENT
      key: ups.BatteryLow
      value_type: UNSIGNED
      history: 30d
      master_item:
        key: ups_megatec.py["{$UPS.IP}","{$UPS.PORT}","{$UPS.TIMEOUT}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $["ups.BatteryLow"]
        error_handler: DISCARD_VALUE
      trends: 365d
      valuemap:
        name: KWDS UPS yes/no UA
    - uuid: 554bcd10e99e41bbb6b75e4407cc93f2
      name: 'UPS: Raw Megatec battery field (not pack voltage)'
      type: DEPENDENT
      key: ups.BatteryRaw
      value_type: FLOAT
      history: 30d
      master_item:
        key: ups_megatec.py["{$UPS.IP}","{$UPS.PORT}","{$UPS.TIMEOUT}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $["ups.BatteryRaw"]
        error_handler: DISCARD_VALUE
      trends: 365d
    - uuid: 761d0f676bc5433b9671c70e835f1c99
      name: 'UPS: Raw Megatec status bits'
      type: DEPENDENT
      key: ups.StatusBits
      value_type: CHAR
      history: 30d
      master_item:
        key: ups_megatec.py["{$UPS.IP}","{$UPS.PORT}","{$UPS.TIMEOUT}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $["ups.StatusBits"]
        error_handler: DISCARD_VALUE
    - uuid: fa17469c5a014ba3a013f7c576e9b894
      name: 'UPS: Estimated output power (not measured)'
      type: DEPENDENT
      key: ups.OutputPowerEstimated
      value_type: FLOAT
      history: 30d
      trends: 365d
      units: W
      master_item:
        key: ups_megatec.py["{$UPS.IP}","{$UPS.PORT}","{$UPS.TIMEOUT}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $["ups.UpsLoad"]
        error_handler: DISCARD_VALUE
      - type: JAVASCRIPT
        parameters:
        - var rated = Number('{$UPS.POWER.RATED.W}'); var load = Number(value); if
          (!isFinite(rated) || rated <= 0 || !isFinite(load) || load < 0 || load >
          100) return null; return Math.round(rated * load / 100 * 10) / 10;
        error_handler: DISCARD_VALUE
      description: 'INDICATIVE ONLY: assumes reported UPS load percent scales linearly
        with rated active watts. Not measured W; depends on UPS manufacturer reporting
        and rating. Default 0 disables.'
    - uuid: c65cc388438c49b380198b5930bd6de5
      name: 'UPS: Estimated remaining runtime (voltage-adjusted, indicative)'
      type: CALCULATED
      key: ups.RuntimeEstimated
      value_type: FLOAT
      delay: '{$UPS.INTERVAL}'
      history: 30d
      trends: 365d
      units: h
      params: '{$UPS.CAPACITY}*last(//ups.BatteryVoltage)*{$UPS.USABLE}*{$UPS.EFF}*power(max(0,min(1,(last(//ups.BatteryVoltage)-{$UPS.BATTERY.VOLT.MIN})/({$UPS.BATTERY.VOLT.MAX}-{$UPS.BATTERY.VOLT.MIN}))),1.5)/max(1,last(//ups.OutputPowerEstimated))'
      description: Heuristic voltage-adjusted remaining runtime in HOURS (not verified
        SOC). Uses host macros CAPACITY, USABLE, EFF, BATTERY.VOLT.MIN/MAX and OutputPowerEstimated.
        Ensure MAX > MIN, calibrated battery voltage and rated output power. Not a
        trustworthy shutdown timer for mixed 6S/7S Li-ion systems.
    - uuid: 8aa2839994c84e8491491adfe06eff12
      name: 'UPS: Effective battery capacity (configured)'
      type: CALCULATED
      key: ups.CapacityConfigured
      value_type: FLOAT
      delay: '{$UPS.INTERVAL}'
      history: 30d
      trends: 365d
      units: Ah
      params: '{$UPS.CAPACITY}'
      description: Effective capacity in Ah set per host. 0 = unconfigured, not measured.
    - uuid: d913937efdcf4c1685f2a18e9672f23c
      name: 'UPS: Estimated remaining runtime (hours and minutes)'
      type: DEPENDENT
      key: ups.RuntimeFormatted
      value_type: CHAR
      history: 30d
      master_item:
        key: ups.RuntimeEstimated
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var h = Number(value);

          if (!isFinite(h) || h < 0) { throw "Runtime unavailable"; }

          var m = Math.round(h * 60);

          return Math.floor(m / 60) + " год " + (m % 60) + " хв";'
        error_handler: DISCARD_VALUE
      description: Display of heuristic ups.RuntimeEstimated as hours and minutes;
        numeric master retained for history/graphs. Zero is a valid model output at
        or below configured minimum voltage.
    - uuid: 55ea18c01fcc479686c0ade027c364a4
      name: 'UPS: Power source state'
      type: DEPENDENT
      key: ups.PowerStateCode
      value_type: UNSIGNED
      history: 30d
      trends: 365d
      valuemap:
        name: KWDS UPS power source state UA
      master_item:
        key: ups_megatec.py["{$UPS.IP}","{$UPS.PORT}","{$UPS.TIMEOUT}"]
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'var d = JSON.parse(value);

          var ob = Number(d["ups.OnBattery"]);

          var lb = Number(d["ups.BatteryLow"]);

          var st = String(d["ups.UpsStatus"] || "");

          if (ob === 1 && lb === 1) { return 3; }

          if (ob === 1) { return 2; }

          if (ob === 0 && lb === 0 && st.indexOf("OL") !== -1) { return 1; }

          return 0;'
        error_handler: DISCARD_VALUE
    - uuid: 0b112322974943c3b34f25ad1286e93c
      name: 'Li-ion: Напруга комірки (оцінка)'
      type: DEPENDENT
      key: ups.CellVoltageEstimated
      value_type: FLOAT
      history: 30d
      trends: 365d
      units: V
      master_item:
        key: ups_megatec.py["{$UPS.IP}","{$UPS.PORT}","{$UPS.TIMEOUT}"]
      preprocessing:
      - type: JSONPATH
        parameters:
        - $["ups.BatteryRaw"]
        error_handler: DISCARD_VALUE
      - type: JAVASCRIPT
        parameters:
        - 'var k = Number(''{$UPS.CELL.MULTIPLIER}'');

          var raw = Number(value);

          if (!isFinite(k) || k <= 0 || !isFinite(raw) || raw < 0) { throw ''Cell
          voltage calibration not configured''; }

          return Math.round(raw * k * 100) / 100;'
        error_handler: DISCARD_VALUE
      description: Estimated voltage of a single Li-ion cell, derived as Q1 BatteryRaw
        * {$UPS.CELL.MULTIPLIER}. Not independently measured; validate physically.
        Does not affect BatteryRaw, BatteryVoltage, runtime or SOC. Округлення до
        0.01 В для показу; це оцінка, не вимір BMS.
