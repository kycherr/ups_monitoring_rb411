  triggers:
  - uuid: d5a321676c1d491695ee53001f4d191e
    expression: nodata(/KWDS UPS Megatec by TCP/ups.InputVoltage,{$UPS.NODATA})=1
    name: 'UPS: No fresh data for {$UPS.NODATA}'
    priority: HIGH
    description: Check MikroTik RAW TCP port and Zabbix ExternalScripts. Detection
      time must exceed sampling interval.
  - uuid: 203151e89aa34f2bb5d51d24f5aad5fd
    expression: last(/KWDS UPS Megatec by TCP/ups.OnBattery)=1
    name: 'UPS: On battery'
    priority: HIGH
  - uuid: 57473e85aa0f4ff198a4c07d950a8ba3
    expression: last(/KWDS UPS Megatec by TCP/ups.BatteryLow)=1
    name: 'UPS: Battery low'
    priority: DISASTER
  - uuid: 19c4c86e6de44a45b2b1d3257dbb4899
    expression: last(/KWDS UPS Megatec by TCP/ups.InputVoltage)<{$UPS.INPUT.MIN}
    name: 'UPS: Input voltage below {$UPS.INPUT.MIN} V'
    priority: WARNING
  - uuid: baad33fedab648ea966ba5621d218fcd
    expression: last(/KWDS UPS Megatec by TCP/ups.InputVoltage)>{$UPS.INPUT.MAX}
    name: 'UPS: Input voltage above {$UPS.INPUT.MAX} V'
    priority: WARNING
  - uuid: c2d9ef8803e44b1095248e185abbff33
    expression: last(/KWDS UPS Megatec by TCP/ups.OutputVoltage)<{$UPS.OUTPUT.MIN}
    name: 'UPS: Output voltage below {$UPS.OUTPUT.MIN} V'
    priority: WARNING
  - uuid: 2a93a93bffc04292ad725742bfa90b11
    expression: last(/KWDS UPS Megatec by TCP/ups.OutputVoltage)>{$UPS.OUTPUT.MAX}
    name: 'UPS: Output voltage above {$UPS.OUTPUT.MAX} V'
    priority: WARNING
  - uuid: 72570148d5974b7392fbd4b61779aa2f
    expression: last(/KWDS UPS Megatec by TCP/ups.UpsLoad)>{$UPS.LOAD.MAX}
    name: 'UPS: UPS load above {$UPS.LOAD.MAX}%'
    priority: HIGH
  - uuid: 539fa3ef9e924da981ed629f75ec3eef
    expression: last(/KWDS UPS Megatec by TCP/ups.UpsTemp)>{$UPS.TEMP.MAX}
    name: 'UPS: UPS temperature above {$UPS.TEMP.MAX}°C'
    priority: WARNING
  - uuid: 3afbfaf2fec8463fa43b888402db9f1c
    expression: last(/KWDS UPS Megatec by TCP/ups.UpsFreq)<{$UPS.FREQ.MIN}
    name: 'UPS: Frequency below {$UPS.FREQ.MIN} Hz'
    priority: WARNING
  - uuid: 16cb614bd5fa4d76a5e1541202344824
    expression: last(/KWDS UPS Megatec by TCP/ups.UpsFreq)>{$UPS.FREQ.MAX}
    name: 'UPS: Frequency above {$UPS.FREQ.MAX} Hz'
    priority: WARNING
  - uuid: d6668b53b1f94775a755f31dd749c6b0
    expression: last(/KWDS UPS Megatec by TCP/ups.BatteryVoltage)<{$UPS.BATTERY.VOLT.WARN}
      and {$UPS.BATTERY.VOLT.WARN}>0 and {$UPS.BATTERY.MULTIPLIER}>0
    name: 'UPS: Battery voltage low (below {$UPS.BATTERY.VOLT.WARN} V)'
    priority: WARNING
    description: Voltage estimates depend on host-specific calibration; only enable
      after verifying real battery voltage.
  - uuid: c6c3a3950f8541689db218f54ff62886
    expression: last(/KWDS UPS Megatec by TCP/ups.BatteryVoltage)<{$UPS.BATTERY.VOLT.CRIT}
      and {$UPS.BATTERY.VOLT.CRIT}>0 and {$UPS.BATTERY.MULTIPLIER}>0
    name: 'UPS: Battery voltage critical (below {$UPS.BATTERY.VOLT.CRIT} V)'
    priority: HIGH
    description: Voltage estimates depend on host-specific calibration; only enable
      after verifying real battery voltage.
  - uuid: 05c18ef43961465991f1d8a23e94e8ed
    name: 'UPS: SOC warning <= {$UPS.SOC.WARN}% (requires calibrated SOC)'
    expression: last(/KWDS UPS Megatec by TCP/ups.BatteryCharge)<={$UPS.SOC.WARN}
      and last(/KWDS UPS Megatec by TCP/ups.BatteryCharge)>{$UPS.SOC.CRIT} and {$UPS.SOC.ALERTS.ENABLED}=1
    priority: WARNING
    description: Disabled by default (macro=0). Activate only with verified genuine
      SOC percent; BatteryRaw and calculated voltage are not SOC.
  - uuid: 1969705b7d854f4aa1c0b0ec65dd5961
    name: 'UPS: SOC critical <= {$UPS.SOC.CRIT}% (requires calibrated SOC)'
    expression: last(/KWDS UPS Megatec by TCP/ups.BatteryCharge)<={$UPS.SOC.CRIT}
      and {$UPS.SOC.ALERTS.ENABLED}=1
    priority: HIGH
    description: Disabled by default (macro=0). Activate only with verified genuine
      SOC percent; BatteryRaw and calculated voltage are not SOC.
